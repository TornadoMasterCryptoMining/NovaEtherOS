services:
  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8082:80"
    environment:
      TZ: UTC
      # Web login password, generated by NovaEtherOS (Apps -> Pi-hole -> Login)
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/etc-pihole:/etc/pihole
